<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}</style>
</helmet>
<div style="width:392px;height:812px;position:relative;background:linear-gradient(180deg,#EFEBFF,#E7F6F3);border-radius:44px;overflow:hidden;box-shadow:0 34px 80px rgba(35,32,72,.26);border:1px solid #fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
  <div style="position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:16px 26px 0;z-index:7;">
    <span style="font-size:14px;font-weight:800;color:#211E40;">9:41</span>
    <div style="display:flex;align-items:center;gap:6px;color:#211E40;">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.4a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      <div style="display:flex;align-items:center;gap:2px;"><span style="width:22px;height:11px;border:1.6px solid #211E40;border-radius:3px;display:inline-flex;align-items:center;padding:1px;"><span style="width:14px;height:7px;background:#211E40;border-radius:1px;"></span></span><span style="width:2px;height:5px;background:#211E40;border-radius:0 1px 1px 0;"></span></div>
    </div>
  </div>

  <div style="position:absolute;top:58px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:6;">
    <span style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);color:#211E40;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(33,30,64,.10);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
    <span style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.8);padding:8px 14px 8px 10px;border-radius:999px;box-shadow:0 6px 16px rgba(33,30,64,.10);"><span style="width:22px;height:16px;border-radius:3px;background:linear-gradient(180deg,#7C5CFF,#4CA9F5);display:inline-block;"></span><span style="font-size:14px;font-weight:800;color:#211E40;">EN</span></span>
  </div>

  <div style="position:absolute;top:48px;left:0;right:0;bottom:0;overflow:hidden;padding:64px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;">
    <div style="position:relative;display:flex;justify-content:center;">
      <span style="position:absolute;top:-6px;left:-14px;width:18px;height:18px;border-radius:50%;background:rgba(124,92,255,.18);"></span>
      <span style="position:absolute;top:14px;right:-18px;width:12px;height:12px;border-radius:50%;background:rgba(20,217,196,.30);"></span>
      <div style="width:128px;height:128px;border-radius:38px;background:rgba(255,255,255,.55);border:2px dashed #B9C0D6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:0 14px 30px rgba(124,92,255,.14);">
        <span style="width:48px;height:48px;border-radius:50%;background:rgba(124,92,255,.16);"></span>
        <span style="font-family:ui-monospace,monospace;font-size:10px;font-weight:700;color:#7E84A0;letter-spacing:.3px;">Poly mascot</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:-1px;">
      <span style="width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:11px solid #fff;filter:drop-shadow(0 -2px 2px rgba(33,30,64,.05));"></span>
      <div style="background:#fff;border-radius:18px;padding:13px 18px;max-width:300px;text-align:center;box-shadow:0 10px 26px rgba(33,30,64,.10);">
        <span style="font-size:15px;font-weight:700;color:#211E40;line-height:1.35;">{{ bubble }}</span>
      </div>
    </div>

    <div style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;">
      <sc-for list="{{ acts }}" as="a" hint-placeholder-count="6">
        <button onClick="{{ a.onClick }}" style="{{ a.tileStyle }}">
          <span style="{{ a.iconWrap }}">
            <sc-if value="{{ a.isMsg }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></sc-if>
            <sc-if value="{{ a.isLayers }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m21 12-9 5-9-5"/><path d="m21 17-9 5-9-5"/></svg></sc-if>
            <sc-if value="{{ a.isSmile }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg></sc-if>
            <sc-if value="{{ a.isEye }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></sc-if>
            <sc-if value="{{ a.isHeart }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.49 4.04 3 5.5l7 7Z"/></svg></sc-if>
            <sc-if value="{{ a.isStar }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.2 6.3L21 11l-6.8 1.7L12 19l-2.2-6.3L3 11l6.8-1.7z"/></svg></sc-if>
          </span>
          <span style="{{ a.labelStyle }}">{{ a.label }}</span>
          <sc-if value="{{ a.selected }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ a.color }}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
        </button>
      </sc-for>
    </div>

    <button onClick="{{ surprise }}" style="margin-top:auto;width:100%;display:flex;align-items:center;justify-content:center;gap:11px;background:linear-gradient(135deg,#7C5CFF,#6A4BF0);color:#fff;border:none;border-radius:999px;padding:17px;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 16px 30px rgba(124,92,255,.38);">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor"/></svg>
      Surprise me
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:392,&quot;height&quot;:812}}">
class Component extends DCLogic {
  state = { sel: null };
  renderVals() {
    const data = [
      { label: 'Talk to Poly', color: '#7C5CFF', icon: 'msg', dark: false },
      { label: 'Memory Cards', color: '#14D9C4', icon: 'layers', dark: false },
      { label: 'Emotions', color: '#FFC93C', icon: 'smile', dark: true },
      { label: 'Eye contact', color: '#FF5B72', icon: 'eye', dark: false },
      { label: 'Say please', color: '#5BD17A', icon: 'heart', dark: false },
      { label: 'Daily care', color: '#4CA9F5', icon: 'star', dark: false }
    ];
    const sel = this.state.sel;
    const ink = '#3A2E12';
    const acts = data.map((d, i) => {
      const on = i === sel;
      const fg = d.dark ? ink : '#fff';
      return {
        label: d.label, color: d.color, selected: on,
        isMsg: d.icon === 'msg', isLayers: d.icon === 'layers', isSmile: d.icon === 'smile',
        isEye: d.icon === 'eye', isHeart: d.icon === 'heart', isStar: d.icon === 'star',
        onClick: () => this.setState({ sel: i }),
        tileStyle: { position: 'relative', display: 'flex', flexDirection: 'column', gap: '10px', alignItems: 'flex-start', textAlign: 'left', borderRadius: '20px', padding: '15px', cursor: 'pointer', fontFamily: 'inherit', background: d.color, border: on ? '3px solid #fff' : '3px solid transparent', boxShadow: on ? ('0 0 0 3px ' + d.color + ', 0 14px 26px ' + d.color + '66') : ('0 10px 22px ' + d.color + '40'), transition: '.18s' },
        iconWrap: { display: 'flex', alignItems: 'center', justifyContent: 'center', width: '40px', height: '40px', borderRadius: '13px', background: d.dark ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.24)', color: fg },
        labelStyle: { fontSize: '14.5px', fontWeight: 800, letterSpacing: '-.2px', color: fg }
      };
    });
    const bubble = sel == null
      ? 'Hi HOSS! What should we do together today?'
      : ('Yay! Let\u2019s do ' + data[sel].label + '.');
    return {
      acts, bubble,
      surprise: () => this.setState({ sel: Math.floor(Math.random() * data.length) })
    };
  }
}
</script>
</body>
</html>

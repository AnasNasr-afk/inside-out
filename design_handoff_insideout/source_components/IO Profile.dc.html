<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}.io-sc::-webkit-scrollbar{width:0;}</style>
</helmet>
<div style="width:392px;height:812px;position:relative;background:#FBFAFF;border-radius:44px;overflow:hidden;box-shadow:0 34px 80px rgba(35,32,72,.26);border:1px solid #fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
  <div style="position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:16px 26px 0;z-index:7;">
    <span style="font-size:14px;font-weight:800;color:#211E40;">9:41</span>
    <div style="display:flex;align-items:center;gap:6px;color:#211E40;">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.4a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      <div style="display:flex;align-items:center;gap:2px;"><span style="width:22px;height:11px;border:1.6px solid #211E40;border-radius:3px;display:inline-flex;align-items:center;padding:1px;"><span style="width:14px;height:7px;background:#211E40;border-radius:1px;"></span></span><span style="width:2px;height:5px;background:#211E40;border-radius:0 1px 1px 0;"></span></div>
    </div>
  </div>

  <div class="io-sc" style="position:absolute;top:48px;left:0;right:0;bottom:0;overflow-y:auto;padding:6px 20px 130px;display:flex;flex-direction:column;gap:18px;">
    <h1 style="margin:4px 2px 0;font-size:28px;font-weight:800;letter-spacing:-.6px;color:#211E40;">Profile</h1>

    <div style="background:#fff;border:1px solid #ECEAF4;border-radius:24px;overflow:hidden;box-shadow:0 8px 22px rgba(33,30,64,.05);">
      <div style="display:flex;align-items:center;gap:16px;padding:18px;">
        <span style="flex:none;width:64px;height:64px;border-radius:20px;background:linear-gradient(140deg,#17E2CD,#0FBDAD);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(20,217,196,.30);"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#06342F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg></span>
        <div style="flex:1;display:flex;flex-direction:column;gap:3px;"><span style="font-size:22px;font-weight:800;color:#211E40;letter-spacing:-.3px;">HOSS</span><span style="font-size:14px;font-weight:600;color:#8B89A6;">12 years old</span></div>
        <span style="flex:none;background:#E2FBF6;color:#0FA697;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:800;">Child</span>
      </div>
      <div style="display:flex;align-items:center;gap:9px;padding:14px 18px;background:#F6F5FB;border-top:1px solid #EFEDF6;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B89A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.04Z"/></svg>
        <span style="font-size:14px;font-weight:600;color:#8B89A6;">Case: <span style="color:#211E40;font-weight:800;">ADHD</span></span>
      </div>
    </div>

    <span style="font-size:17px;font-weight:800;color:#211E40;letter-spacing:-.2px;">Care Team</span>
    <div style="display:flex;gap:13px;">
      <div style="flex:1;background:#fff;border:1px solid #ECEAF4;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 18px rgba(33,30,64,.04);">
        <div style="display:flex;align-items:center;justify-content:space-between;"><span style="width:44px;height:44px;border-radius:50%;background:#FFE7EC;color:#FF5B72;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;">A</span><span style="background:#FFE7EC;color:#E25069;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;">Parent</span></div>
        <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:16px;font-weight:800;color:#211E40;">Anas</span><span style="font-size:12px;font-weight:500;color:#9A98B6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Primary caregiver</span></div>
      </div>
      <div style="flex:1;background:#fff;border:1px solid #ECEAF4;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 18px rgba(33,30,64,.04);">
        <div style="display:flex;align-items:center;justify-content:space-between;"><span style="width:44px;height:44px;border-radius:50%;background:#EDE9FF;color:#7C5CFF;display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span><span style="background:#EDE9FF;color:#6A4BF0;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;">Specialist</span></div>
        <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:16px;font-weight:800;color:#211E40;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">DR Omnia Nasr</span><span style="font-size:12px;font-weight:500;color:#9A98B6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Child psychologist</span></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;margin-top:2px;">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:13px;padding:17px 4px;border-top:1px solid #EFEDF6;">
          <span style="{{ m.iconWrap }}">
            <sc-if value="{{ m.isHelp }}" hint-placeholder-val="{{ true }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></sc-if>
            <sc-if value="{{ m.isTerms }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg></sc-if>
            <sc-if value="{{ m.isPrivacy }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></sc-if>
            <sc-if value="{{ m.isAbout }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></sc-if>
            <sc-if value="{{ m.isLogout }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></sc-if>
          </span>
          <span style="{{ m.labelStyle }}">{{ m.label }}</span>
          <span style="{{ m.chevColor }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to top,#FBFAFF 38%,rgba(251,250,255,0));pointer-events:none;z-index:5;"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:26px 16px 16px;z-index:6;">
    <dc-import name="IO BottomNav" active="profile" hint-size="100%,80px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:392,&quot;height&quot;:812}}">
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { label: 'Help & FAQ', key: 'Help' },
      { label: 'Terms & Conditions', key: 'Terms' },
      { label: 'Privacy Policy', key: 'Privacy' },
      { label: 'About App', key: 'About' },
      { label: 'Log Out', key: 'Logout' }
    ];
    const menu = rows.map(r => {
      const danger = r.key === 'Logout';
      return {
        label: r.label,
        isHelp: r.key === 'Help', isTerms: r.key === 'Terms', isPrivacy: r.key === 'Privacy', isAbout: r.key === 'About', isLogout: danger,
        iconWrap: { flex: 'none', width: '40px', height: '40px', borderRadius: '13px', background: danger ? '#FFE7EC' : '#F4F2FB', color: danger ? '#FF5B72' : '#7C5CFF', display: 'flex', alignItems: 'center', justifyContent: 'center' },
        labelStyle: { flex: '1', fontSize: '16px', fontWeight: 700, letterSpacing: '-.2px', color: danger ? '#FF5B72' : '#211E40' },
        chevColor: { color: danger ? '#FF5B72' : '#C2BFD6', display: 'flex' }
      };
    });
    return { menu };
  }
}
</script>
</body>
</html>

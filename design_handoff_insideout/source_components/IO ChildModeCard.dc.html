<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}</style>
</helmet>
<div style="display:flex;align-items:center;gap:14px;border-radius:22px;padding:15px 16px;background:linear-gradient(135deg,#F3F0FF,#FBEEF5);border:1px solid #ECE6FF;font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
  <div style="flex:none;width:52px;height:52px;border-radius:16px;background:linear-gradient(140deg,#7C5CFF,#9B7BFF);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 22px rgba(124,92,255,.30);">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5"/></svg>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:3px;">
    <span style="font-size:16px;font-weight:800;color:#211E40;letter-spacing:-.2px;">Child Mode</span>
    <span style="font-size:12.5px;color:#7E7BA0;font-weight:500;">{{ sub }}</span>
  </div>
  <button onClick="{{ toggle }}" style="{{ trackStyle }}"><span style="{{ knobStyle }}"></span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:392,&quot;height&quot;:92}}">
class Component extends DCLogic {
  state = { on: false };
  renderVals() {
    const on = this.state.on;
    return {
      toggle: () => this.setState(s => ({ on: !s.on })),
      sub: on ? 'On · a kid-safe, gentle space' : 'A calmer, simpler space for kids',
      trackStyle: { width: '52px', height: '30px', borderRadius: '999px', border: 'none', cursor: 'pointer', padding: '3px', transition: '.22s', background: on ? '#14D9C4' : '#D9D6EA', display: 'flex', alignItems: 'center', flex: 'none' },
      knobStyle: { width: '24px', height: '24px', borderRadius: '50%', background: '#fff', boxShadow: '0 2px 6px rgba(0,0,0,.18)', transition: '.22s', transform: on ? 'translateX(22px)' : 'translateX(0)' }
    };
  }
}
</script>
</body>
</html>
